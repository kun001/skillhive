name: Publish images

# Builds the SkillHive server, web and scanner images and pushes them to GHCR:
#   ghcr.io/<owner>/skillhive-server|skillhive-web|skillhive-scanner
# Tags: `edge` + `sha-<short>` for main; `X.Y.Z`, `vX.Y.Z` and `latest` for v* tags.
# Pushes to main that only touch docs or other non-image paths are skipped; tag pushes
# always build (GitHub does not evaluate path filters for tags).
# These are the defaults used by compose.release.yml, .env.release.example and the Helm chart.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'server/**'
      - 'web/**'
      - 'scanner/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: server
            platforms: linux/amd64,linux/arm64,linux/riscv64
          - component: web
            context: web
            platforms: linux/amd64,linux/arm64,linux/riscv64
          - component: scanner
            context: scanner
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR repository names must be lower case.
          images: ghcr.io/${{ github.repository_owner }}/skillhive-${{ matrix.component }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=skillhive-${{ matrix.component }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
