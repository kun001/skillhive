apiVersion: v2
name: skillhub
description: Self-hosted AI skills and knowledge hub for teams (SkillHive).
type: application
version: 0.3.0
appVersion: 0.3.0
keywords:
  - skillhive
  - ai
  - skills
home: https://github.com/kun001/skillhive
icon: https://raw.githubusercontent.com/kun001/skillhive/main/skillhive-docs/assets/skillhive-logo.svg
sources:
  - https://github.com/kun001/skillhive

dependencies:
  # PostgreSQL - Bitnami 官方 chart，支持 HA、备份、监控
  - name: postgresql
    version: "18.6.10"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled

  # Redis - Bitnami 官方 chart，支持集群模式、哨兵模式
  - name: redis
    version: "25.5.3"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
