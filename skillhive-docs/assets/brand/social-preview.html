.preview img { display:block; width:100%; height:auto; }
.footer { position:absolute; left:65px; right:65px; bottom:37px; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:18px; }

.cta { font-weight:600; color:var(--accent); }
